[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strategy-lab"
version = "0.1.0"
description = "Лаборатория классических торговых стратегий для USDT-M перпетуалов Binance"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "requests>=2.31",
    "scipy>=1.11",
]

[project.optional-dependencies]
# ускорение цикла движка и параллельные прогоны сетки (Этап 3, 7)
speed = ["numba>=0.59", "joblib>=1.3"]
dev = ["pytest>=8.0", "pytest-cov>=4.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
